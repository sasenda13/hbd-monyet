
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff6b9a">

<title>Happy Birthday 🎂</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: -apple-system, BlinkMacSystemFont,
               "Segoe UI", sans-serif;
  background: linear-gradient(
    135deg, #ff9a9e, #fad0c4, #ffd1ff
  );
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;
}

.card {
  width: 90%;
  max-width: 430px;
  padding: 38px 25px;
  text-align: center;
  border-radius: 30px;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  box-shadow: 0 20px 60px rgba(120,30,70,0.25);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  z-index: 2;
}

.cake {
  font-size: 72px;
  animation: bounce 1.8s infinite;
}

h1 {
  font-size: 34px;
  margin: 12px 0;
}

h2 {
  font-size: 21px;
  font-weight: 500;
  margin-bottom: 25px;
}

p {
  font-size: 17px;
  line-height: 1.7;
}

.heart {
  position: fixed;
  bottom: -30px;
  font-size: 22px;
  pointer-events: none;
  animation: floatUp linear forwards;
  z-index: 1;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0) rotate(-3deg);
  }
  50% {
    transform: translateY(-12px) rotate(3deg);
  }
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="cake">🎂</div>

  <h1>Happy Birthday! 🎉</h1>

  <h2>Untuk monyet yang suka marah 🐒</h2>

  <p>
    Selamat ulang tahun! 🥳<br>
    Semoga di umur yang baru ini,<br>
    semua hal baik datang menghampirimu.
  </p>

  <p>
    Semoga selalu sehat, bahagia,<br>
    dimudahkan dalam setiap langkah,<br>
    dan semua impianmu bisa terwujud. ✨
  </p>

</div>

<script>
function createHeart() {
  const heart = document.createElement("div");

  heart.className = "heart";

  heart.textContent = ["💖", "💕", "💗", "✨", "🎈"]
    [Math.floor(Math.random() * 5)];

  heart.style.left = Math.random() * 100 + "vw";

  heart.style.animationDuration =
    (4 + Math.random() * 3) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 7500);
}

setInterval(createHeart, 700);
</script>

</body>
</html>
