<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffd1ff);
  color: white;
  overflow: hidden;
}

.card {
  width: 90%;
  max-width: 430px;
  padding: 35px 24px;
  text-align: center;
  border-radius: 30px;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  box-shadow: 0 20px 60px #b34d7750;
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  z-index: 2;
}

.cake {
  font-size: 72px;
  animation: bounce 1.8s infinite;
}

h1 {
  font-size: 36px;
}

h2 {
  font-size: 22px;
  font-weight: 500;
}

p {
  font-size: 17px;
  line-height: 1.7;
}

.heart {
  position: fixed;
  bottom: -30px;
  animation: floatUp 5s linear forwards;
  pointer-events: none;
}

@keyframes bounce {
  50% {
    transform: translateY(-12px);
  }
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="cake">🎂</div>

  <h1>Happy Birthday 🎉</h1>

  <h2>Untuk monyet yang suka marah 🐒</h2>

  <p>
    Ciee yg udah umurnya 16<br>
    Moga aja di umur yang baru ini<br>
    Banyak yg kasih pisang ya wkwk
  </p>

  <p>
    moga selalu sehat, bahagia,<br>
    dimudahkan dalam setiap langkah,<br>
    sama jgn banyak gambling
  </p>

</div>

<script>

function createHeart() {

  const heart = document.createElement("div");

  heart.className = "heart";

  heart.textContent = ["🍌", "🐒", "💗", "✨", "🎈"][
    Math.floor(Math.random() * 5)
  ];

  heart.style.left = Math.random() * 100 + "vw";

  heart.style.animationDuration =
    (3 + Math.random() * 4) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 650);

</script>

</body>
</html>
